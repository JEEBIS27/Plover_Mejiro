[metadata]
name = Mejiro
version = 2.8.0
description = Japanese stenography for Plover
long_description = file: README.md
long_description_content_type = text/markdown
author = JEEBIS27
author_email = jeebis.iox@gmail.com
license = GPL-3.0-or-later
url =https://github.com/JEEBIS27/Plover_Mejiro
project_urls =
	Source Code = https://github.com/JEEBIS27/Plover_Mejiro
	Issue Tracker = https://github.com/JEEBIS27/Plover_Mejiro/issues
keywords = plover plover_plugin

[options]
zip_safe = False
python_requires = >=3.9
setup_requires =
	setuptools>=30.3.0
install_requires =
        plover>=5.2.3
   		plover-python-dictionary
packages =
	Mejiro
	Mejiro.dictionaries.default

[options.entry_points]
plover.system =
 Mejiro = Mejiro.system
plover.extension =
 mejiro_engine = Mejiro.formatting:EngineExtension
plover.meta =
 mejiro_engine = Mejiro.engine:require_extension
plover.command =
 mejiro_ime = Mejiro.ime:set_ime
 mejiro_alternate = Mejiro.ime:select_alternate
plover.macro =
 mejiro_repeat_last_output = Mejiro.formatting:repeat_last_output
 mejiro_undo = Mejiro.formatting:mejiro_undo

[options.exclude_package_data]
Mejiro.dictionaries =
    default/*
