name: Windows wheel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/wheels.yml'
      - 'tools/check_wheel.py'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'Mejiro/**'
      - 'vendor/mejiro-engine/**'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Select Rust toolchain
        run: rustup override set 1.88.0
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import configparser, os; c = configparser.ConfigParser(); c.read('setup.cfg'); assert os.environ['RELEASE_TAG'] == 'v' + c['metadata']['version'], 'Release tag must match setup.cfg version'"
      - name: Build wheel with bundled DLL
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check installed wheel
        run: python tools/check_wheel.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: mejiro-windows-x64-wheel
          path: dist/*.whl
          if-no-files-found: error
  release:
    if: github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mejiro-windows-x64-wheel
          path: dist
      - name: Attach verified wheel to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl
